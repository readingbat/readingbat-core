version: 2

updates:
  # Every action in .github/workflows is pinned to a full commit SHA (zizmor's unpinned-uses audit), and a
  # SHA never moves on its own. Dependabot bumps the SHA together with the trailing `# vX.Y.Z` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a release age a week before adopting it, so a compromised or yanked release is likely caught
    # first. Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    # One PR per week for all actions, rather than one per action.
    groups:
      github-actions:
        patterns:
          - "*"
