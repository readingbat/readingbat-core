name: Dependency Submission

# GitHub's dependency graph can't read this Gradle build by itself, so without this workflow Dependabot alerts cover
# none of the Kotlin and Java dependencies, and an empty alert list means nothing. This resolves them on each push to
# master and submits the result. No schedule: GitHub rechecks the last submission whenever an advisory is published.
#
# Only runtimeClasspath is submitted, which is what readingbat-core and readingbat-kotest put on a consumer's classpath.
# Alerts can't distinguish a runtime library from a build tool, so Detekt, ktlint and Dokka would only add noise.
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Dependency Submission API requires write access. Nothing in this job runs on a pull request, so the token is
    # never handed to code from a fork.
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-submit
          dependency-graph-include-configurations: runtimeClasspath
