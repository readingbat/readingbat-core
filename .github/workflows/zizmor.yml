name: zizmor

on:
  push:
    branches: [ master, dev-* ]
  pull_request:
    branches: [ master ]
  # zizmor's online audits (known-vulnerable-actions and friends) depend on advisories published
  # against the actions we already use, so new findings can appear without any change here.
  schedule:
    - cron: '17 9 * * 1'

permissions: {}

jobs:
  zizmor:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    # Findings are uploaded to code scanning (the Security tab and PR annotations) as SARIF, so this
    # job only fails on an internal error, never on a finding. To make findings block a merge, add a
    # code scanning merge-protection ruleset rather than changing this job. Run `make zizmor` for the
    # same audit locally.
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
