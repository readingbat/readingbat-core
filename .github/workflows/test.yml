name: Tests

on:
  push:
    branches: [ master, dev-* ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Playwright's Java driver downloads the browser binaries but not the OS libraries they need,
      # and WebKit needs a long list of them (libgtk-4, gstreamer, flite) that ubuntu-latest does not
      # carry. Chromium happens to run without this; WebKit does not, and PlaywrightTabsTest asserts
      # in both. The version is read from the catalog so it cannot drift from the playwright
      # dependency, the same way the Makefile derives GRADLE_VERSION.
      - name: Install WebKit system dependencies
        run: |
          version=$(grep -m1 -E '^playwright = "' gradle/libs.versions.toml | cut -d'"' -f2)
          # This workflow runs on pull_request, so on a fork PR the catalog is attacker-controlled,
          # and the value below becomes an npm package spec that `npx --yes` installs and executes.
          # Quoting stops command injection but not spec substitution -- `playwright@git+https://...`
          # is a legitimate spec -- so require a literal version before npx ever sees it.
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to install: unexpected playwright version '$version'" >&2
            exit 1
          fi
          npx --yes playwright@"$version" install-deps webkit

      - name: Build and test
        run: ./gradlew build koverXmlReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          fail_ci_if_error: false
          verbose: true
